<!doctype html>
<html lang="en">
  <head>
    <meta name="game-uuid" content="8988197c-0f5b-4384-9841-06ea166314fe" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06110e" />
    <title>Living Byline</title>
    <style id="alteru-long-press-guard">html,body,#app,#root{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}input,textarea,[contenteditable="true"]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}img,svg,canvas{-webkit-user-drag:none}</style>
    <style>
      html,body{margin:0;min-height:100%;background:#06110e;color:#dfe4d7}
      .lb-boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#06110e;transition:opacity .32s ease,visibility .32s}
      .lb-boot.is-ready{opacity:0;visibility:hidden;pointer-events:none}
      .lb-boot__mark{position:relative;width:88px;height:56px;border:1px solid rgba(223,228,215,.34)}
      .lb-boot__mark::before,.lb-boot__mark::after{content:"";position:absolute;background:#9b553d;animation:lb-boot-register 1.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
      .lb-boot__mark::before{left:9px;top:9px;width:28px;height:38px}
      .lb-boot__mark::after{right:9px;top:17px;width:34px;height:22px;background:#dfe4d7;animation-delay:-.6s}
      .lb-boot__label{margin-top:18px;font:700 10px/1 ui-monospace,monospace;letter-spacing:.24em;text-align:center}
      @keyframes lb-boot-register{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
      @media(prefers-reduced-motion:reduce){.lb-boot__mark::before,.lb-boot__mark::after{animation:none}}
    </style>
    <script src="https://images.aiwaves.tech/alteru/guest-shell.js" defer></script>
  </head>
  <body>
    <div class="lb-boot" role="status" aria-live="polite">
      <div><div class="lb-boot__mark" aria-hidden="true"></div><div class="lb-boot__label">LIVING BYLINE</div></div>
    </div>
    <main id="app"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
